name: 📊 Telegram Market Wrap Alert

on:
  schedule:
    # 17:20 PM Bangkok Time (UTC+7) = 10:20 AM UTC (Mon - Fri)
    # Summarizes SET market performance after closing auction finishes (~17:00)
    - cron: '20 10 * * 1-5'
  workflow_dispatch:

jobs:
  market_wrap:
    name: Send End-of-Day Market Wrap
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: 📊 Send Market Wrap Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/send_thai_stock_alerts.py --type market_wrap
