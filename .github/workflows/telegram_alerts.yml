name: Automated Telegram Alerts (Gold, Oil, Thai Stocks & Sectors)

on:
  schedule:
    # 08:00 AM Bangkok Time (UTC+7) = 01:00 AM UTC
    # Runs Monday to Friday (1-5)
    - cron: '0 1 * * 1-5'
    # 08:00 AM Bangkok Time on the 1st of every month (for Monthly Sector Outlook)
    - cron: '0 1 1 * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'เลือกงานแจ้งเตือนที่ต้องการรัน'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - thai_stocks
          - weekly_sector
          - monthly_sector
          - gold_news
          - oil_chart
          - all

jobs:
  telegram_alerts:
    name: Run Telegram Alerts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📅 Check Bangkok Date & Day
        id: check_day
        run: |
          DAY_OF_WEEK=$(TZ=Asia/Bangkok date +%u)
          DAY_OF_MONTH=$(TZ=Asia/Bangkok date +%-d)
          TODAY_DATE=$(TZ=Asia/Bangkok date '+%Y-%m-%d %H:%M:%S')
          echo "Bangkok Time: $TODAY_DATE"
          echo "Bangkok Day of Week (1=Mon, 2=Tue, 3=Wed, 4=Thu, 5=Fri): $DAY_OF_WEEK"
          echo "Bangkok Day of Month: $DAY_OF_MONTH"
          if [ "$DAY_OF_WEEK" = "2" ]; then
            echo "is_tuesday=true" >> $GITHUB_OUTPUT
          else
            echo "is_tuesday=false" >> $GITHUB_OUTPUT
          fi

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: 🌐 Install Playwright Chromium
        # Only install Playwright Chromium when Oil Chart is scheduled (Tuesday) or requested
        if: |
          (steps.check_day.outputs.is_tuesday == 'true' && (github.event_name == 'schedule' || github.event.inputs.task == 'auto')) ||
          github.event.inputs.task == 'oil_chart' ||
          github.event.inputs.task == 'all'
        run: |
          playwright install --with-deps chromium

      - name: 📢 Send Gold News Digest (XAU/USD)
        # Runs Monday - Friday (08:00 AM BKK)
        if: |
          github.event_name == 'schedule' ||
          github.event.inputs.task == 'auto' ||
          github.event.inputs.task == 'gold_news' ||
          github.event.inputs.task == 'all'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/send_gold_news.py

      - name: 🛢️ Send WTI Oil Chart Screenshot
        # Runs every Tuesday at 08:00 AM BKK or when selected
        if: |
          (steps.check_day.outputs.is_tuesday == 'true' && (github.event_name == 'schedule' || github.event.inputs.task == 'auto')) ||
          github.event.inputs.task == 'oil_chart' ||
          github.event.inputs.task == 'all'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/send_oil_chart.py

      - name: 📈 Send Thai Stock & Sector Alerts
        # Runs Monday-Friday for Top Stocks, Monday for Weekly Sector, 1st of Month for Monthly Sector
        if: |
          github.event_name == 'schedule' ||
          github.event.inputs.task == 'auto' ||
          github.event.inputs.task == 'thai_stocks' ||
          github.event.inputs.task == 'weekly_sector' ||
          github.event.inputs.task == 'monthly_sector' ||
          github.event.inputs.task == 'all'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/send_thai_stock_alerts.py --type ${{ github.event.inputs.task || 'auto' }}
