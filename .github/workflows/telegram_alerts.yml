name: Automated Telegram Alerts (Gold, Oil, Thai Stocks & Sectors)

on:
  schedule:
    # 08:00 AM Bangkok Time (UTC+7) = 01:00 AM UTC (Mon - Fri: Gold News, Daily Top Stocks, Weekly Sector on Mon)
    - cron: '0 1 * * 1-5'
    # 08:00 AM Bangkok Time on the 1st of every month (for Monthly Sector Outlook)
    - cron: '0 1 1 * *'
    # 10:30 AM & 14:30 PM Bangkok Time (03:30 & 07:30 UTC: Intraday Breakout & Volume Alert)
    - cron: '30 3,7 * * 1-5'
    # 17:15 PM Bangkok Time (10:15 UTC: End-of-Day Market Wrap)
    - cron: '15 10 * * 1-5'
  workflow_dispatch:
    inputs:
      task:
        description: 'เลือกงานแจ้งเตือนที่ต้องการรัน'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - thai_stocks
          - weekly_sector
          - monthly_sector
          - intraday_alert
          - market_wrap
          - gold_news
          - oil_chart
          - all

jobs:
  telegram_alerts:
    name: Run Telegram Alerts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📅 Check Bangkok Date & Day
        id: check_day
        run: |
          DAY_OF_WEEK=$(TZ=Asia/Bangkok date +%u)
          DAY_OF_MONTH=$(TZ=Asia/Bangkok date +%-d)
          BKK_HOUR=$(TZ=Asia/Bangkok date +%-H)
          TODAY_DATE=$(TZ=Asia/Bangkok date '+%Y-%m-%d %H:%M:%S')
          echo "Bangkok Time: $TODAY_DATE"
          echo "Bangkok Day of Week (1=Mon, 2=Tue, 3=Wed, 4=Thu, 5=Fri): $DAY_OF_WEEK"
          echo "Bangkok Day of Month: $DAY_OF_MONTH"
          echo "Bangkok Hour: $BKK_HOUR"
          if [ "$DAY_OF_WEEK" = "2" ]; then
            echo "is_tuesday=true" >> $GITHUB_OUTPUT
          else
            echo "is_tuesday=false" >> $GITHUB_OUTPUT
          fi
          # Check morning slot (scheduled at 08:00 AM Bangkok Time / 01:00 UTC)
          # Covers hours 7-9 to account for potential GitHub Actions runner queue delay
          if [ "$BKK_HOUR" -ge 7 ] && [ "$BKK_HOUR" -le 9 ]; then
            echo "is_morning_slot=true" >> $GITHUB_OUTPUT
          else
            echo "is_morning_slot=false" >> $GITHUB_OUTPUT
          fi

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: 🌐 Install Playwright Chromium
        # Only install Playwright Chromium when Oil Chart is scheduled (Tuesday 08:00 AM morning slot) or requested
        if: |
          (steps.check_day.outputs.is_tuesday == 'true' && steps.check_day.outputs.is_morning_slot == 'true' && (github.event_name == 'schedule' || github.event.inputs.task == 'auto')) ||
          github.event.inputs.task == 'oil_chart' ||
          github.event.inputs.task == 'all'
        run: |
          playwright install --with-deps chromium

      - name: 📢 Send Gold News Digest (XAU/USD)
        # Runs Monday - Friday at 08:00 AM BKK (morning slot only) or when requested
        if: |
          (steps.check_day.outputs.is_morning_slot == 'true' && (github.event_name == 'schedule' || github.event.inputs.task == 'auto')) ||
          github.event.inputs.task == 'gold_news' ||
          github.event.inputs.task == 'all'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/send_gold_news.py

      - name: 🛢️ Send WTI Oil Chart Screenshot
        # Runs every Tuesday at 08:00 AM BKK (morning slot only) or when requested
        if: |
          (steps.check_day.outputs.is_tuesday == 'true' && steps.check_day.outputs.is_morning_slot == 'true' && (github.event_name == 'schedule' || github.event.inputs.task == 'auto')) ||
          github.event.inputs.task == 'oil_chart' ||
          github.event.inputs.task == 'all'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/send_oil_chart.py

      - name: 📈 Send Thai Stock, Sector & Market Alerts
        # Runs Monday-Friday for Top Stocks, Monday for Weekly Sector, 1st of Month for Monthly Sector, Intraday Breakouts, and Market Wrap
        if: |
          github.event_name == 'schedule' ||
          github.event.inputs.task == 'auto' ||
          github.event.inputs.task == 'thai_stocks' ||
          github.event.inputs.task == 'weekly_sector' ||
          github.event.inputs.task == 'monthly_sector' ||
          github.event.inputs.task == 'intraday_alert' ||
          github.event.inputs.task == 'market_wrap' ||
          github.event.inputs.task == 'all'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/send_thai_stock_alerts.py --type ${{ github.event.inputs.task || 'auto' }}
