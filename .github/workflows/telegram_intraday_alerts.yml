name: ⚡ Telegram Intraday Breakout & Volume Alert

on:
  schedule:
    # 14:35 PM Bangkok Time (UTC+7) = 07:35 AM UTC (Mon - Fri)
    # Scans for real breakouts during active afternoon SET trading session
    - cron: '35 7 * * 1-5'
  workflow_dispatch:

jobs:
  intraday_alert:
    name: Scan & Send Intraday Breakouts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: ⚡ Scan & Send Intraday Breakout Alert
        # Note: If no stocks break out today, the script will gracefully exit with no message sent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/send_thai_stock_alerts.py --type intraday_alert
