name: 🌅 Telegram Morning Alerts (Gold, Oil, Stocks & Sectors)

on:
  schedule:
    # 07:45 AM Bangkok Time (UTC+7) = 00:45 AM UTC (Mon - Fri: Gold News, Daily Top Stocks, Weekly Sector on Mon)
    # Using minute 45 avoids the top-of-hour GitHub Actions scheduler queue congestion
    - cron: '45 0 * * 1-5'
    # 07:45 AM Bangkok Time on the 1st of every month (for Monthly Sector Outlook)
    - cron: '45 0 1 * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'เลือกงานแจ้งเตือนรอบเช้าที่ต้องการทดสอบหรือรัน'
        required: true
        default: 'all_morning'
        type: choice
        options:
          - all_morning
          - gold_news
          - oil_chart
          - daily_stocks
          - weekly_sector
          - monthly_sector
  repository_dispatch:
    types: [morning_alerts]

jobs:
  morning_alerts:
    name: Run Telegram Morning Alerts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUNNER_ENV: "github_actions"
      FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📅 Check Bangkok Date & Day
        id: check_day
        run: |
          DAY_OF_WEEK=$(TZ=Asia/Bangkok date +%u)
          DAY_OF_MONTH=$(TZ=Asia/Bangkok date +%-d)
          TODAY_DATE=$(TZ=Asia/Bangkok date '+%Y-%m-%d %H:%M:%S')
          echo "Bangkok Time: $TODAY_DATE"
          echo "Bangkok Day of Week (1=Mon, 2=Tue, 3=Wed, 4=Thu, 5=Fri): $DAY_OF_WEEK"
          echo "Bangkok Day of Month: $DAY_OF_MONTH"
          
          if [ "$DAY_OF_WEEK" = "1" ]; then
            echo "is_monday=true" >> $GITHUB_OUTPUT
          else
            echo "is_monday=false" >> $GITHUB_OUTPUT
          fi

          if [ "$DAY_OF_WEEK" = "2" ]; then
            echo "is_tuesday=true" >> $GITHUB_OUTPUT
          else
            echo "is_tuesday=false" >> $GITHUB_OUTPUT
          fi

          if [ "$DAY_OF_MONTH" = "1" ]; then
            echo "is_first_day=true" >> $GITHUB_OUTPUT
          else
            echo "is_first_day=false" >> $GITHUB_OUTPUT
          fi

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: 🌐 Install Playwright Chromium
        # Only install Playwright Chromium when Oil Chart is scheduled (Tuesday) or explicitly requested
        if: |
          (steps.check_day.outputs.is_tuesday == 'true' && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event.inputs.task == 'all_morning')) ||
          github.event.inputs.task == 'oil_chart'
        run: |
          playwright install --with-deps chromium

      - name: 📢 Send Gold News Digest (XAU/USD)
        # Runs Monday - Friday morning or when requested
        if: |
          github.event_name == 'schedule' ||
          github.event_name == 'repository_dispatch' ||
          github.event.inputs.task == 'all_morning' ||
          github.event.inputs.task == 'gold_news'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/send_gold_news.py

      - name: 🛢️ Send WTI Oil Chart Screenshot
        # Runs every Tuesday morning or when requested
        if: |
          (steps.check_day.outputs.is_tuesday == 'true' && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event.inputs.task == 'all_morning')) ||
          github.event.inputs.task == 'oil_chart'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/send_oil_chart.py

      - name: 📈 Send Daily Top Thai Stock Picks
        # Runs Monday - Friday morning or when requested
        if: |
          github.event_name == 'schedule' ||
          github.event_name == 'repository_dispatch' ||
          github.event.inputs.task == 'all_morning' ||
          github.event.inputs.task == 'daily_stocks'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/send_thai_stock_alerts.py --type daily_stocks

      - name: ⚡ Send Weekly Sector Rotation
        # Runs every Monday morning or when requested
        if: |
          (steps.check_day.outputs.is_monday == 'true' && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event.inputs.task == 'all_morning')) ||
          github.event.inputs.task == 'weekly_sector'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/send_thai_stock_alerts.py --type weekly_sector

      - name: 🗓️ Send Monthly Sector Outlook
        # Runs on 1st of month morning or when requested
        if: |
          (steps.check_day.outputs.is_first_day == 'true' && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event.inputs.task == 'all_morning')) ||
          github.event.inputs.task == 'monthly_sector'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/send_thai_stock_alerts.py --type monthly_sector
